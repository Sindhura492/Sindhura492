name: Generate Snake Animation

on:
  schedule:
    # Update every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate GitHub Contribution Grid Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Sindhura492
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?color_snake=#FF6B9D&color_dots=#FFC107,#FF6B9D,#FFFFFF,#008CC1,#FFE66D

      - name: Commit files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git checkout -b output 2>/dev/null || git checkout output
          mkdir -p output
          cp dist/*.svg output/ || true
          git add output/*.svg
          git diff --staged --quiet || (git commit -m "Generate snake animation [skip ci]" && git push origin output --force)

